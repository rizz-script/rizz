name: Build LSP Server

on:
  push:
    branches: [ main, master ]
    paths:
      - 'apps/rizz-lsp/**'
      - 'packages/core/**'
      - '.github/workflows/build-lsp.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'apps/rizz-lsp/**'
      - 'packages/core/**'
      - '.github/workflows/build-lsp.yml'
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build:
    name: Build LSP ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rizz-lsp-x86_64-unknown-linux-gnu
            archive_format: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: rizz-lsp-aarch64-unknown-linux-gnu
            archive_format: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: rizz-lsp-x86_64-apple-darwin
            archive_format: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: rizz-lsp-aarch64-apple-darwin
            archive_format: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rizz-lsp-x86_64-pc-windows-msvc
            archive_format: zip
            binary_ext: .exe

    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compilation tools (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Configure cross-compilation (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p ~/.cargo
          echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }} --manifest-path apps/rizz-lsp/Cargo.toml

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p release
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp target/${{ matrix.target }}/release/rizz-lsp.exe release/rizz-lsp.exe
          else
            cp target/${{ matrix.target }}/release/rizz-lsp release/rizz-lsp
          fi

      - name: Create archive (tar.gz)
        if: matrix.archive_format == 'tar.gz'
        shell: bash
        run: |
          cd release
          tar czf ../${{ matrix.artifact_name }}.${{ matrix.archive_format }} rizz-lsp*
          cd ..

      - name: Create archive (zip - Windows)
        if: matrix.archive_format == 'zip' && runner.os == 'Windows'
        shell: pwsh
        run: |
          cd release
          Compress-Archive -Path rizz-lsp* -DestinationPath ../${{ matrix.artifact_name }}.${{ matrix.archive_format }} -Force
          cd ..

      - name: Create archive (zip - Unix)
        if: matrix.archive_format == 'zip' && runner.os != 'Windows'
        shell: bash
        run: |
          cd release
          zip -r ../${{ matrix.artifact_name }}.${{ matrix.archive_format }} rizz-lsp*
          cd ..

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.archive_format }}
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release Archive
        run: |
          mkdir -p release-assets
          find artifacts -name "*.tar.gz" -exec cp {} release-assets/ \;
          find artifacts -name "*.zip" -exec cp {} release-assets/ \;

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
