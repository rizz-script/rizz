[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rizzscript"
version = "0.1.0"
description = "RizzScript v0.1 interpreter (language core)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "aiohttp>=3.9.0",
]

[project.scripts]
rizz = "rizzscript.cli:main"

