[package]
name = "rizz-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "RizzScript v0.1 core library"

[lib]
name = "rizz_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.86"
async-trait = "0.1.85"
async-recursion = "1.1.1"
regex = "1.11.1"
serde_json = "1.0.135"
tokio = { version = "1.43.0", features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "fs", "time", "process"] }
# Pinned to 0.11.x and rustls-only to avoid OpenSSL / MSRV issues.
reqwest = { version = "0.13.1", default-features = false, features = ["json","rustls","native-tls"] }
# Pin url to pre-icu/idna1 stack for rustc 1.82 compatibility.
url = "2.5.8"
rand = "0.9.2"
globset = "0.4.18"
notify = "8.2.0"
walkdir = "2.5.0"

