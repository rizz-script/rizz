[package]
name = "rizz"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "RizzScript v0.1 CLI"

[[bin]]
name = "rizz"
path = "src/main.rs"

[dependencies]
rizz-core = { path = "../../packages/core" }
anyhow = "1.0.86"
clap = { version = "4.5.27", features = ["derive"] }
tokio = { version = "1.43.0", features = ["macros", "rt", "rt-multi-thread", "fs", "process", "io-util"] }
globset = "0.4.18"
notify = "8.2.0"
walkdir = "2.5.0"

